<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4067A1;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#428AC8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1"/>
    </linearGradient>
    <!-- Right diagonal clip for decorative background area -->
    <clipPath id="diagClip">
      <polygon points="230,0 1280,0 1280,720 400,720"/>
    </clipPath>
    <!-- Left panel clip -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="230" height="720"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Right diagonal decorative panel (blue-gray background) -->
  <polygon points="230,0 1280,0 1280,720 400,720" fill="#EAF3FB"/>

  <!-- Diagonal border line (signature element from real template) -->
  <polyline points="230,0 400,720" fill="none" stroke="#3C64A0" stroke-width="1.5"/>

  <!-- Right-side decorative image/pattern -->
  <image xlink:href="assets/inline_dd7ff26b63bb.png" x="230" y="0" width="1050" height="720"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#diagClip)"/>

  <!-- Left content panel (white) -->
  <rect x="0" y="0" width="230" height="720" fill="#FFFFFF"/>

  <!-- Left panel bottom icon placeholder (company figure) -->
  <image xlink:href="assets/inline_2c178af5269e.png" x="30" y="250" width="160" height="220"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- "目  录" title on left panel -->
  <text x="60" y="190" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="37" font-weight="bold" fill="#428AC8">目</text>
  <text x="124" y="190" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="37" font-weight="bold" fill="#428AC8">录</text>

  <!-- TOC table separator lines -->
  <!-- Top heavy border -->
  <line x1="362" y1="60" x2="1216" y2="60" stroke="#7F7F7F" stroke-width="3"/>
  <!-- Row dividers -->
  <line x1="362" y1="118" x2="1216" y2="118" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="176" x2="1216" y2="176" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="234" x2="1216" y2="234" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="292" x2="1216" y2="292" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="350" x2="1216" y2="350" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="408" x2="1216" y2="408" stroke="#7F7F7F" stroke-width="1"/>
  <line x1="362" y1="466" x2="1216" y2="466" stroke="#7F7F7F" stroke-width="1"/>
  <!-- Bottom heavy border -->
  <line x1="362" y1="524" x2="1216" y2="524" stroke="#7F7F7F" stroke-width="3"/>

  <!-- TOC Item 1 (ACTIVE/HIGHLIGHTED - white text) -->
  <text x="362" y="100" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#FFFFFF">{{TOC_ITEM_1_NUM}}</text>
  <text x="440" y="100" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#FFFFFF">{{TOC_ITEM_1_TITLE}}</text>

  <!-- TOC Item 2 (inactive - light gray) -->
  <text x="362" y="158" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_2_NUM}}</text>
  <text x="440" y="158" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_2_TITLE}}</text>

  <!-- TOC Item 3 -->
  <text x="362" y="216" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_3_NUM}}</text>
  <text x="440" y="216" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_3_TITLE}}</text>

  <!-- TOC Item 4 -->
  <text x="362" y="274" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_4_NUM}}</text>
  <text x="440" y="274" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_4_TITLE}}</text>

  <!-- TOC Item 5 -->
  <text x="362" y="332" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_5_NUM}}</text>
  <text x="440" y="332" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_5_TITLE}}</text>

  <!-- TOC Item 6 -->
  <text x="362" y="390" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_6_NUM}}</text>
  <text x="440" y="390" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_6_TITLE}}</text>

  <!-- TOC Item 7 (optional) -->
  <text x="362" y="448" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_7_NUM}}</text>
  <text x="440" y="448" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_7_TITLE}}</text>

  <!-- TOC Item 8 (optional) -->
  <text x="362" y="506" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_8_NUM}}</text>
  <text x="440" y="506" font-family="'Microsoft YaHei', Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#D3D3D3">{{TOC_ITEM_8_TITLE}}</text>

  <!-- Footer color bar -->
  <rect x="0" y="706" width="1280" height="14" fill="url(#footerGrad)"/>
</svg>
